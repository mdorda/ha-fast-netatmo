version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned on purpose: it fixes the minimum supported Home Assistant version.
      # CI also tests against the latest release.
      - dependency-name: pytest-homeassistant-custom-component
